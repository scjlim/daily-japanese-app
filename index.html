<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Accelerated Japanese</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex flex-col h-screen font-sans">

<!-- Login Screen Overlay -->
<div id="login-screen" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-6">
  <i class="fas fa-lock text-4xl text-gray-400 mb-4"></i>
  <h2 class="text-xl font-bold text-gray-800 mb-6">Enter App Password</h2>
  <input id="password-input" type="password" class="border rounded-lg p-3 w-full max-w-xs mb-4 text-center text-lg outline-blue-500 shadow-sm">
  <button onclick="login()" class="bg-blue-600 text-white font-bold py-3 px-8 rounded-lg shadow w-full max-w-xs active:bg-blue-700">Unlock App</button>
  <p id="login-error" class="text-red-500 text-sm mt-4 hidden">Incorrect password.</p>
</div>

<script>
  const VERCEL_AUTH_URL = "/api/gateway"; 
  let API_URL = ""; // Remains empty and secure in the source code!
  
  let appPassword = localStorage.getItem('appPassword') || '';
  let sentences = [];
  let isPracticeMode = false;
  let isPlayingAll = false;
  let selectedIds = new Set();
  const globalAudioPlayer = new Audio();

  // Login Logic: Talk to Vercel to get the secret URL
  async function login() {
    const input = document.getElementById('password-input').value;
    if (!input) return;
    appPassword = input;
    document.getElementById('loading').classList.remove('hidden');
    
    try {
      const res = await fetch(VERCEL_AUTH_URL, {
        headers: { 'x-app-password': appPassword }
      });
      
      if (res.status === 401) {
        document.getElementById('login-error').classList.remove('hidden');
        appPassword = '';
        localStorage.removeItem('appPassword');
      } else {
        const data = await res.json();
        API_URL = data.targetUrl; // Securely load URL into app memory
        localStorage.setItem('appPassword', appPassword);
        document.getElementById('login-screen').classList.add('hidden');
        await init();
      }
    } catch (e) {
      alert("Network Error verifying password.");
    } finally {
      document.getElementById('loading').classList.add('hidden');
    }
  }

  // Auto-login check on load
  window.onload = async () => {
    if (appPassword) {
      document.getElementById('loading').classList.remove('hidden');
      try {
        const res = await fetch(VERCEL_AUTH_URL, {
          headers: { 'x-app-password': appPassword }
        });
        if (res.status === 401) {
          localStorage.removeItem('appPassword');
          appPassword = '';
        } else {
          const data = await res.json();
          API_URL = data.targetUrl; // Securely load URL into app memory
          document.getElementById('login-screen').classList.add('hidden');
          await init();
        }
      } catch(e) {
        alert("Server unreachable.");
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }
  };

  // Direct communication with Google using the unlocked URL
  async function apiCall(action, payload = {}) {
    document.getElementById('loading').classList.remove('hidden');
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action, ...payload })
      });
      const result = await res.json();
      if (result.error) alert(result.error);
      return result;
    } catch(e) {
      alert("Network error.");
    } finally {
      document.getElementById('loading').classList.add('hidden');
    }
  }

  async function init() {
    document.getElementById('loading').classList.remove('hidden');
    const res = await fetch(`${API_URL}?action=getCategories`);
    const categories = await res.json();
    const select = document.getElementById('category-select');
    select.innerHTML = '';
    categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.innerText = cat;
      select.appendChild(opt);
    });
    if (categories.length > 0) loadCategory(categories[0]);
  }

  async function loadCategory(category) {
    document.getElementById('loading').classList.remove('hidden');
    selectedIds.clear();
    const res = await fetch(`${API_URL}?category=${encodeURIComponent(category)}`);
    sentences = await res.json();
    renderCards();
    document.getElementById('loading').classList.add('hidden');
  }

  function renderCards() {
    const container = document.getElementById('card-container');
    container.innerHTML = '';
    
    sentences.forEach((s, index) => {
      const card = document.createElement('div');
      card.id = `card-${index}`;
      card.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-3 relative";
      
      const isUnfilled = !s.japanese;
      const japClass = isPracticeMode && !isUnfilled ? "blur-md cursor-pointer select-none" : "";
      const displayJap = isUnfilled ? "<span class='text-red-400 italic text-sm'>[Not Translated]</span>" : s.japanese;
      const displayRomaji = isUnfilled ? "" : s.romaji;
      
      card.innerHTML = `
        <div class="absolute top-3 right-3 flex gap-3 items-center">
          <input type="checkbox" onchange="toggleSelect(${s.id}, this.checked)" class="w-5 h-5 accent-blue-600">
          <button onclick="deleteSentence(${s.id})" class="text-red-400 hover:text-red-600"><i class="fas fa-trash"></i></button>
        </div>
        <div class="text-xs text-gray-400 font-bold mb-1">#${index + 1}</div>
        <div class="text-gray-800 font-medium mb-2 pr-12">${s.chinese}</div>
        <div class="text-blue-600 font-bold text-lg ${japClass}" onclick="this.classList.remove('blur-md')">${displayJap}</div>
        <div class="text-gray-500 text-sm mb-3 ${japClass}" onclick="this.classList.remove('blur-md')">${displayRomaji}</div>
        ${!isUnfilled ? `<button onclick="playAudio('${s.japanese}')" class="bg-blue-50 text-blue-600 px-4 py-2 rounded-lg text-sm font-bold w-full active:bg-blue-100"><i class="fas fa-volume-up mr-1"></i> Play</button>` : ''}
      `;
      container.appendChild(card);
    });
  }

  function toggleSelect(id, isChecked) {
    isChecked ? selectedIds.add(id) : selectedIds.delete(id);
  }

  function toggleMode() {
    isPracticeMode = !isPracticeMode;
    const btn = document.getElementById('mode-btn');
    btn.innerText = isPracticeMode ? "Practice: ON" : "Play: ON";
    btn.className = isPracticeMode ? "bg-purple-100 text-purple-700 px-3 py-1 rounded text-sm font-bold" : "bg-blue-100 text-blue-700 px-3 py-1 rounded text-sm font-bold";
    renderCards();
  }

  async function addCategory() {
    const name = prompt("Enter new category name:");
    if (!name) return;
    await apiCall('addCategory', { category: name });
    init();
  }

  async function deleteCategory() {
    const category = document.getElementById('category-select').value;
    if (confirm(`⚠️ WARNING: Are you sure you want to delete the entire category "${category}"?`)) {
      await apiCall('deleteCategory', { category });
      init();
    }
  }

  async function addSentence() {
    const text = prompt("Enter a new Chinese sentence:");
    if (!text) return;
    const category = document.getElementById('category-select').value;
    await apiCall('addSentence', { category, chineseText: text });
    loadCategory(category); 
  }

  async function deleteSentence(id) {
    if (confirm("⚠️ WARNING: Delete this sentence?")) {
      const category = document.getElementById('category-select').value;
      await apiCall('deleteSentence', { category, id });
      loadCategory(category);
    }
  }

  async function translateSelected() {
    if (selectedIds.size === 0) return alert("Please select sentences to translate.");
    const category = document.getElementById('category-select').value;
    await apiCall('translateSelected', { category, ids: Array.from(selectedIds) });
    loadCategory(category);
  }

  async function translateUnfilled() {
    if (confirm("Bulk translate all unfilled sentences in this category?")) {
      const category = document.getElementById('category-select').value;
      await apiCall('translateUnfilled', { category });
      loadCategory(category);
    }
  }

  function playAudio(text) {
    return new Promise((resolve) => {
      globalAudioPlayer.pause(); 
      const speed = parseFloat(document.getElementById('speed-select').value);
      globalAudioPlayer.src = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ja&q=${encodeURIComponent(text)}`;
      globalAudioPlayer.playbackRate = speed;
      globalAudioPlayer.onended = resolve;
      globalAudioPlayer.onerror = resolve; 
      globalAudioPlayer.play().catch(err => { resolve(); });
    });
  }

  async function playAll() {
    isPlayingAll = !isPlayingAll;
    const btn = document.getElementById('play-all-btn');
    const gapTime = parseFloat(document.getElementById('gap-input').value) * 1000;

    if (!isPlayingAll) {
      btn.innerHTML = '<i class="fas fa-play mr-2"></i> Play All';
      btn.classList.replace('bg-red-500', 'bg-green-500');
      globalAudioPlayer.pause();
      return;
    }
    
    btn.innerHTML = '<i class="fas fa-stop mr-2"></i> Stop';
    btn.classList.replace('bg-green-500', 'bg-red-500');

    globalAudioPlayer.src = "";
    globalAudioPlayer.play().catch(e => {});

    for (let i = 0; i < sentences.length; i++) {
      if (!isPlayingAll) break;
      if (!sentences[i].japanese) continue; 
      
      const card = document.getElementById(`card-${i}`);
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.add('ring-2', 'ring-blue-400');
      
      await playAudio(sentences[i].japanese);
      
      card.classList.remove('ring-2', 'ring-blue-400');
      
      if (isPlayingAll && i < sentences.length - 1) {
        await new Promise(r => setTimeout(r, gapTime));
      }
    }
    
    isPlayingAll = false;
    btn.innerHTML = '<i class="fas fa-play mr-2"></i> Play All';
    btn.classList.replace('bg-red-500', 'bg-green-500');
  }
</script>

<!-- Header & Title -->
<header class="bg-white shadow-sm p-4 sticky top-0 z-10">
  <div class="text-center mb-4">
    <h1 class="text-lg font-bold text-gray-800">Accelerated Japanese Conversation Learning</h1>
    <p class="text-xs text-gray-500">developed by: Johnson Lim</p>
  </div>
  
  <div class="flex justify-between items-center bg-gray-100 p-2 rounded-lg">
    <select id="category-select" onchange="loadCategory(this.value)" class="bg-transparent border-none text-sm font-bold text-gray-700 outline-none flex-1"></select>
    <div class="flex gap-3 px-2">
      <button onclick="addCategory()" class="text-blue-500"><i class="fas fa-folder-plus"></i></button>
      <button onclick="deleteCategory()" class="text-red-500"><i class="fas fa-trash-alt"></i></button>
    </div>
  </div>
</header>

<!-- Controls & Actions -->
<div class="px-4 py-3 bg-white border-b border-gray-100 flex flex-col gap-3">
  <div class="flex justify-between items-center">
    <button id="mode-btn" onclick="toggleMode()" class="bg-blue-100 text-blue-700 px-3 py-1 rounded text-sm font-bold">Play: ON</button>
    
    <div class="flex gap-2">
      <select id="speed-select" class="text-sm bg-gray-50 border rounded p-1">
        <option value="1">1.0x Speed</option>
        <option value="0.75">0.75x</option>
        <option value="0.5">0.5x</option>
      </select>
      <div class="flex items-center text-sm text-gray-500 bg-gray-50 border rounded p-1">
        <i class="fas fa-hourglass-half mr-1 text-xs"></i>
        <input id="gap-input" type="number" value="2" class="w-8 bg-transparent text-center outline-none" min="0" step="0.5">s
      </div>
    </div>
  </div>

  <div class="flex gap-2 text-sm font-bold">
    <button onclick="addSentence()" class="flex-1 bg-gray-800 text-white py-2 rounded shadow">+ Add</button>
    <button onclick="translateSelected()" class="flex-1 bg-indigo-500 text-white py-2 rounded shadow">Trans Sel.</button>
    <button onclick="translateUnfilled()" class="flex-1 bg-purple-500 text-white py-2 rounded shadow">Trans All</button>
  </div>
</div>

<!-- Scrollable Content -->
<main id="card-container" class="flex-1 overflow-y-auto p-4 pb-24"></main>

<!-- Loading Overlay -->
<div id="loading" class="fixed inset-0 bg-white/80 flex items-center justify-center z-50 hidden">
  <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-500 border-t-transparent"></div>
</div>

<!-- Bottom Play All Bar -->
<div class="fixed bottom-0 w-full p-4 bg-white border-t border-gray-200">
  <button id="play-all-btn" onclick="playAll()" class="w-full bg-green-500 text-white rounded-xl py-3 font-bold shadow-lg flex items-center justify-center active:scale-95 transition-transform">
    <i class="fas fa-play mr-2"></i> Play All
  </button>
</div>

</body>
</html>
